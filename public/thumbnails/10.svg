<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="glow-10" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-10" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" rx="1" fill="#00D9FF" opacity="0.08"/>
    </pattern>
    <style>
      .title-10 { font-family: 'Exo 2', system-ui, sans-serif; font-weight: 900; }
      .mono-10  { font-family: 'Space Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0a0a10"/>

  <!-- Glow -->
  <rect width="800" height="500" fill="url(#glow-10)"/>

  <!-- Grid -->
  <rect width="800" height="500" fill="url(#grid-10)"/>

  <!-- Accent bar top -->
  <rect y="0" width="800" height="4" fill="#00D9FF"/>

  <!-- Large project number watermark -->
  <text x="760" y="470" class="mono-10" font-size="140" fill="#00D9FF" opacity="0.04"
        text-anchor="end" dominant-baseline="auto">10</text>

  <!-- Content area -->

  <!-- Title -->
  <g class="title-10" font-size="46" fill="#ffffff" font-weight="900" letter-spacing="-1">
    <text x="48" y="146">ADVERSARIAL</text>
    <text x="48" y="198">ROBUSTNESS OF</text>
    <text x="48" y="250">OPEN-SOURCE RAG</text>
    <text x="48" y="302">PIPELINES</text>
  </g>

  <!-- Divider line -->
  <line x1="48" y1="328" x2="400" y2="328" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Bottom accent -->
  <line x1="48" y1="460" x2="200" y2="460" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.15"/>
</svg>
