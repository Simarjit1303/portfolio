<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="glow-02" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-02" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" rx="1" fill="#00FF88" opacity="0.08"/>
    </pattern>
    <style>
      .title-02 { font-family: 'Exo 2', system-ui, sans-serif; font-weight: 900; }
      .mono-02  { font-family: 'Space Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0a0a10"/>
  <!-- Glow -->
  <rect width="800" height="500" fill="url(#glow-02)"/>
  <!-- Grid -->
  <rect width="800" height="500" fill="url(#grid-02)"/>
  <!-- Accent bar top -->
  <rect y="0" width="800" height="4" fill="#00FF88"/>

  <!-- Large project number watermark -->
  <text x="760" y="470" class="mono-02" font-size="140" fill="#00FF88" opacity="0.04"
        text-anchor="end" dominant-baseline="auto">02</text>

  <!-- Type label -->
  <text x="48" y="80" class="mono-02" font-size="11" fill="#00FF88" letter-spacing="3">DATA ANALYSIS</text>

  <!-- Title -->
  <text x="48" y="130" class="title-02" font-size="36" fill="#ffffff" font-weight="900" letter-spacing="-0.5">E-COMMERCE</text>
  <text x="48" y="172" class="title-02" font-size="36" fill="#ffffff" font-weight="900" letter-spacing="-0.5">CUSTOMER BEHAVIOUR</text>

  <!-- Divider line -->
  <line x1="48" y1="195" x2="500" y2="195" stroke="#00FF88" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Tech pills -->
  <g class="mono-02" font-size="11">
    <rect x="48" y="400" width="68" height="26" rx="13" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.3" stroke-width="1"/>
    <text x="82" y="418" fill="#00FF88" fill-opacity="0.8" text-anchor="middle">Python</text>

    <rect x="124" y="400" width="62" height="26" rx="13" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.3" stroke-width="1"/>
    <text x="155" y="418" fill="#00FF88" fill-opacity="0.8" text-anchor="middle">Pandas</text>

    <rect x="194" y="400" width="52" height="26" rx="13" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.3" stroke-width="1"/>
    <text x="220" y="418" fill="#00FF88" fill-opacity="0.8" text-anchor="middle">SciPy</text>

    <rect x="254" y="400" width="54" height="26" rx="13" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.3" stroke-width="1"/>
    <text x="281" y="418" fill="#00FF88" fill-opacity="0.8" text-anchor="middle">Plotly</text>

    <rect x="316" y="400" width="40" height="26" rx="13" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.3" stroke-width="1"/>
    <text x="336" y="418" fill="#00FF88" fill-opacity="0.8" text-anchor="middle">SQL</text>
  </g>

  <!-- Bottom accent -->
  <line x1="48" y1="460" x2="220" y2="460" stroke="#00FF88" stroke-width="1" stroke-opacity="0.15"/>
</svg>
