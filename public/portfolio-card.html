<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simarjit Singh — Portfolio Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 800px;
      height: 450px;
      overflow: hidden;
      background: #0d0d14;
    }

    .card {
      width: 800px;
      height: 450px;
      background: radial-gradient(ellipse at 40% 50%, #131326 0%, #0d0d14 55%, #121212 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      font-family: 'Exo 2', sans-serif;
      overflow: hidden;
    }

    /* ── Top accent bar ── */
    .accent-bar {
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #00D9FF 0%, #00a8cc 60%, transparent 100%);
      flex-shrink: 0;
    }

    /* ── Main body ── */
    .body {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 32px 36px 28px 40px;
      gap: 0;
      position: relative;
    }

    /* ══════════════════════════════
       LEFT COLUMN  (60%)
    ══════════════════════════════ */
    .left {
      flex: 0 0 60%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Name */
    .name {
      font-family: 'Exo 2', sans-serif;
      font-weight: 900;
      font-size: 42px;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
      /* subtle text glow */
      text-shadow: 0 0 40px rgba(0, 217, 255, 0.15);
    }

    /* Title */
    .title {
      font-family: 'Exo 2', sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.02em;
      line-height: 1.4;
    }
    .title .accent { color: #00D9FF; }
    .title .muted  { color: rgba(255,255,255,0.55); }

    /* Location + badge row */
    .meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    .location {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.03em;
    }

    .dot-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 6px;
      border: 1px solid rgba(0, 217, 255, 0.35);
      border-radius: 3px;
      background: rgba(0, 217, 255, 0.06);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00D9FF;
      box-shadow: 0 0 6px #00D9FF;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    .badge-text {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: #00D9FF;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Tech pills */
    .pills-section {
      margin-top: 4px;
    }

    .pills-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .pill {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(0, 217, 255, 0.85);
      background: rgba(0, 217, 255, 0.07);
      border: 1px solid rgba(0, 217, 255, 0.2);
      padding: 4px 10px;
      border-radius: 2px;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    /* Contact row */
    .contact-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .contact-divider {
      width: 48px;
      height: 1px;
      background: rgba(0, 217, 255, 0.25);
      margin-bottom: 4px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .contact-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      opacity: 0.5;
    }

    .contact-text {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.02em;
    }

    .contact-text strong {
      color: rgba(255,255,255,0.7);
      font-weight: 400;
    }

    /* ══════════════════════════════
       RIGHT COLUMN  (40%)
    ══════════════════════════════ */
    .right {
      flex: 0 0 40%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Concentric rings */
    .rings {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0, 217, 255, 0.12);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .ring-1 { width: 280px; height: 280px; border-color: rgba(0,217,255,0.08); }
    .ring-2 { width: 220px; height: 220px; border-color: rgba(0,217,255,0.12); }
    .ring-3 { width: 160px; height: 160px; border-color: rgba(0,217,255,0.16); }
    .ring-4 { width: 100px; height: 100px; border-color: rgba(0,217,255,0.20); }

    /* Cross-hair lines */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
    }

    .crosshair::before,
    .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(0, 217, 255, 0.07);
    }
    .crosshair::before {
      width: 1px;
      height: 100%;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }
    .crosshair::after {
      height: 1px;
      width: 100%;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }

    /* Data node dots on ring circumferences */
    .node-group {
      position: absolute;
      top: 50%;
      left: 50%;
    }

    /* Monogram */
    .monogram-wrap {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .monogram-bg {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,217,255,0.12) 0%, rgba(0,217,255,0.03) 60%, transparent 100%);
      border: 2px solid rgba(0, 217, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 30px rgba(0, 217, 255, 0.08),
        inset 0 0 20px rgba(0, 217, 255, 0.04);
    }

    .monogram {
      font-family: 'Exo 2', sans-serif;
      font-weight: 900;
      font-size: 36px;
      letter-spacing: -0.02em;
      color: #00D9FF;
      text-shadow:
        0 0 20px rgba(0, 217, 255, 0.6),
        0 0 40px rgba(0, 217, 255, 0.3);
    }

    /* SVG data nodes */
    .data-svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 290px;
      height: 290px;
      z-index: 2;
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-top: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }

    .bottom-left {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.08em;
    }

    .bottom-right {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: rgba(0, 217, 255, 0.3);
      letter-spacing: 0.06em;
    }

    /* ── Ambient glow orb ── */
    .glow-orb {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 217, 255, 0.04) 0%, transparent 70%);
      top: 50%;
      right: -50px;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Subtle grid texture overlay ── */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,217,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Print styles ── */
    @media print {
      html, body {
        width: 800px;
        height: 450px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .card {
        width: 800px;
        height: 450px;
      }

      .badge-dot {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Grid texture -->

  <!-- Top accent bar -->

        <div class="title">

          </svg>

        <div class="contact-item">

    </div><!-- /left -->

      <!-- Concentric rings -->

      <!-- Cross-hair -->
      <div class="crosshair"></div>

      <!-- SVG data nodes / constellation -->

        <circle cx="145" cy="5"   r="3" fill="#00D9FF" opacity="0.6"/>
        <!-- Top-right 45° -->
        <circle cx="244" cy="46" r="2.5" fill="#00D9FF" opacity="0.4"/>
        <!-- Right -->
        <circle cx="285" cy="145" r="3" fill="#00D9FF" opacity="0.6"/>
        <!-- Bottom-right -->
        <circle cx="244" cy="244" r="2.5" fill="#00D9FF" opacity="0.4"/>
        <!-- Bottom -->

        <!-- Bottom-left -->
